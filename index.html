ght:35px;padding:7px 11px;font-size:12px;border-radius:9px}.btn.full{width:100%}h1,h2,h3,h4,p{margin-top:0}h1{font-size:28px;letter-spacing:-.9px;margin-bottom:7px}h2{font-size:20px;letter-spacing:-.35px;margin-bottom:5px}h3{font-size:16px;margin-bottom:5px}h4{margin:0 0 10px;font-size:13px}p{color:var(--muted)}.muted{color:var(--muted)}.small-text{font-size:12px}.eyebrow{text-transform:uppercase;letter-spacing:1.3px;font-weight:800;font-size:10px;color:var(--teal);margin-bottom:5px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:21px}.stat,.panel,.job,.truckcard,.trip{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.stat{padding:17px 17px 14px}.stat .lbl{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);font-weight:700}.stat .value{font-size:27px;font-weight:850;letter-spacing:-1.2px;margin:7px 0 3px;font-variant-numeric:tabular-nums}.stat .sub{font-size:11px;color:var(--muted)}.statusdot{width:9px;height:9px;border-radius:50%;background:var(--teal);display:inline-block}.statusdot.busy{background:#d08b3c}.tabbar{display:flex;gap:5px;overflow:auto;border-bottom:1px solid #d7e2e5;margin:0 0 22px;scrollbar-width:none}.tabbar::-webkit-scrollbar{display:none}.tab{white-space:nowrap;background:transparent;padding:13px 19px;color:#627781;font-weight:780;border-bottom:3px solid transparent}.tab.active{border-bottom-color:var(--teal);color:var(--teal)}.section-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:18px}.section-head p{margin-bottom:0;font-size:13px}.content-grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;align-items:start;gap:18px}.jobgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.job{padding:17px;display:flex;flex-direction:column;gap:12px}.jobtop{display:flex;align-items:center;justify-content:space-between;gap:10px}.serial{font-size:11px;font-weight:800;c ce-between;align-items:center;margin-bottom:11px;gap:6px}.truckcard .id{font-weight:900;font-size:17px;letter-spacing:-.4px}.truckcard .model{font-size:12px;font-weight:780;color:#42616e;margin:6px 0 4px}.truckcard .sub{font-size:11.5px;color:var(--muted);margin-bottom:9px}.truckcard .meta{border-top:1px solid #ecf1f2;padding-top:9px;margin-top:9px;font-size:11px;color:var(--muted)}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.financials{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin:14px 0 20px}.finbox{border-radius:12px;background:#f3f7f8;padding:14px}.finbox small{display:block;color:var(--muted);font-size:11px;margin-bottom:7px}.finbox strong{font-size:19px;letter-spacing:-.5px}.ledger{display:grid;gap:9px}.trip{padding:15px;display:grid;grid-template-columns:1fr auto;gap:8px}.trip strong{display:block;font-size:14px}.trip small{color:var(--muted);font-size:11px}.result{font-size:18px;font-weight:900}.positive{color:#078774}.negative{color:#c14b40}.neutral{color:#5e7280}.empty{border:1px dashed #b8cbce;padding:35px 22px;border-radius:15px;text-align:center;background:#fafcfc}.empty strong{display:block;margin-bottom:5px}.empty p{margin:0 auto;max-width:440px;font-size:13px}.progress-track{height:9px;background:#e9eff0;border-radius:15px;overflow:hidden;margin:10px 0 5px}.progress-fill{height:100%;background:var(--teal);border-radius:15px;transition:width .2s}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:12px;font-weight:780;color:#4a6570}.field input,.field select{border:1px solid #c9d8dc;border-radius:10px;width:100%;min-height:43px;padding:10px 12px;background:white;color:var(--ink)}.field .help{font-size:10px;color:var(--muted)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.divider{height:1px;background:#e4ecee;margin:16px 0}.big-total{font-weight:900;font-size:31px;letter-spacing:-1.3px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:9px}.mini-kpi{padding:11px;border-radius:11px;background:#f0f5f5}.mini-kpi small{font-size:10px;color:var(--muted);display:block}.mini-kpi strong{font-size:20px;letter-spacing:-.5px}.costline{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #eff3f4;padding:8px 0;font-size:12px}.costline:last-child{border-bottom:0}.costline span{color:var(--muted)}.costline strong{font-variant-numeric:tabular-nums}.highlight{background:var(--mint);border:1px solid #bde1d3;border-radius:12px;padding:12px;margin:10px 0}.highlight.warn{background:var(--amberbg);border-color:#f0d6a9}.highlight.bad{background:var(--redbg);border-color:#efd0cc}.highlight strong{display:block;font-size:13px}.highlight small{display:block;font-size:11px;line-height:1.4;margin-top:4px;color:#57716b}.highlight.warn small{color:#8f6b36}.highlight.bad small{color:#9d514b}.drawer-back{position:fixed;inset:0;background:rgba(8,25,35,.58);z-index:12;display:flex;justify-content:flex-end}.drawer{background:#fff;max-width:510px;width:100%;height:100%;overflow:auto;box-shadow:-12px 0 55px #0002;overscroll-behavior:contain}.drawer-head{padding:20px 20px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2;display:flex;justify-content:space-between;gap:10px;align-items:start}.drawer-body{padding:19px 20px 35px}.iconbutton{background:#f0f4f5;border-radius:50%;font-size:20px;width:36px;height:36px;flex:none;display:grid;place-items:center}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:22;background:#193c43;color:white;border-radius:12px;padding:13px 18px;box-shadow:0 11px 35px #1237;max-width:min(92vw,520px);text-align:center;font-size:13px;font-weight:700}.lesson{border-left:3px solid var(--teal);padding:12px 14px;background:#f3faf8;border-radius:0 10px 10px 0;font-size:13px;color:#375b55}.lesson p{margin:0;font-size:12px}.settingnote{background:#eaf2f4;border-radius:11px;padding:13px;font-size:12px;color:#4c6570;margin:12px 0}.callout{background:#ebf9f5;border:1px solid #c5e6de;padding:15px;border-radius:13px}.little-icon{display:inline-block;margin-right:3px}.footer{font-size:11px;color:#81929b;text-align:center;margin-top:33px}.select-count{font-size:12px;color:#58727a;white-space:nowrap}.breakdown{border:1px solid #e2ebed;border-radius:13px;padding:13px;margin-top:12px}.breakdown h4{margin-bottom:6px}.summary-strip{display:flex;gap:9px;flex-wrap:wrap}.summary-strip span{font-size:11px;font-weight:730;background:#eef4f5;padding:6px 9px;border-radius:9px;color:#44616a}.footnote{font-size:10px;color:#788d94;margin:8px 0 0}.top-actions{display:flex;gap:9px;flex-wrap:wrap}.note-badge{background:#214958;border:1px solid #456f79;color:#e1ffff;border-radius:8px;padding:5px 8px;font-size:10px;font-weight:700}.settingsrow{display:flex;justify-content:space-between;align-items:center;gap:10px}.kpilabel{color:var(--muted);font-size:10px;text-transform:uppercase;font-weight:850;letter-spacing:.8px}.subtle-warning{border-radius:10px;background:#fff8ec;border:1px solid #f2dfbd;color:#886838;padding:11px 12px;font-size:11.5px}.legend{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin:10px 0}.legend span{font-size:10px;color:#657e83}.route-arrow{color:#39a897}.inline{display:inline-flex;align-items:center;gap:5px}.no-scroll{overflow:hidden}input[type=number]{font-variant-numeric:tabular-nums}details{margin-top:12px}summary{font-weight:800;cursor:pointer;font-size:13px}details p{margin:8px 0;font-size:12px}a{color:var(--teal)}

@media(max-width:720px){header{padding:16px 16px 18px}.brand strong{font-size:19px}.brand small{font-size:10px}.headernote{font-size:11px;margin-top:13px}.logo{width:40px;height:40px}.wrap{padding:17px 12px 45px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:14px}.stat{padding:13px}.stat .value{font-size:24px}.stat .sub{font-size:10px}.tabbar{margin-bottom:15px}.tab{padding:12px 13px;font-size:13px}.content-grid{grid-template-columns:1fr}.jobgrid{grid-template-columns:1fr}.side-stack{grid-template-columns:1fr 1fr}.section-head{display:block}.section-head .top-actions{margin-top:12px}.fleetgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.truckcard{padding:12px}.truckcard .id{font-size:15px}.financials{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.drawer{max-width:100%}.drawer-head{padding:16px}.drawer-body{padding:16px 16px 40px}.daybadge{font-size:11px;padding:7px 9px}.btn{padding:10px 12px}.grid2{grid-template-columns:1fr}}

<body>
<div id="app"></div>
<script>
(()=>{'use strict';
const KEY='rotalab.simulador.v1';
const TYPES={seca:{label:'Truck · carga seca',short:'Truck seco',cap:14,kmL:3.25,maint:.69,fixed:155,compat:['seca']},sider:{label:'Carreta · sider',short:'Carreta sider',cap:28,kmL:2.45,maint:1.1,fixed:215,compat:['seca','sider']},granel:{label:'Carreta · graneleira',short:'Graneleira',cap:30,kmL:2.15,maint:1.25,fixed:238,compat:['granel']}};
const DEST=[['Campinas',130],['São Paulo',115],['Santos',190],['Jundiaí',105],['Ribeirão Preto',300],['Piracicaba',155],['Limeira',165],['Araraquara',275],['Bauru',315],['Franca',410],['Curitiba',455],['Rio de Janeiro',575],['Taubaté',255],['São José dos Campos',225]];
const CARGOS={seca:{nome:'Material ensacado',tipo:'seca',min:7,max:13},sider:{nome:'Carga paletizada',tipo:'sider',min:18,max:27},granel:{nome:'Cimento a granel',tipo:'granel',min:20,max:29}};
const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const formatMoney=n=>BRL.format(Number(n)||0);const formatNum=n=>Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:1});
const $=sel=>document.querySelector(sel);
let state;let ui={tab:'fretes',jobFilter:'abertos',fleetFilter:'todos',fleetType:'todos',drawerId:null,draft:null,expandSettings:false};let toastTimer;
const escape=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function random(){state.seed=(state.seed*1664525+1013904223)>>>0;return state.seed/4294967296}
function randInt(a,b){return Math.floor(random()*(b-a+1))+a}
function pick(arr){return arr[Math.floor(random()*arr.length)]}
function makeFleet(){let fleet=[];let i=0;for(const [type,count] of [['seca',12],['sider',10],['granel',8]])for(let k=0;k<count;k++){i++;let specs=TYPES[type];fleet.push({id:`CAM-${String(i).padStart(2,'0')}`,driver:`Motorista ${String(i).padStart(2,'0')}`,type,cap:specs.cap,kmL:Number((specs.kmL+(k%4-1.5)*.1).toFixed(2)),commission:10+(i%6),availableDay:1,assignment:null,completed:0})}return fleet}
function newState(){state={version:1,day:1,seed:20261114,seq:0,settings:{diesel:6.25,tax:6,target:15},fleet:makeFleet(),jobs:[],trips:[],logs:[]};generateJobs(11);return state}
function load(){try{let data=JSON.parse(localStorage.getItem(KEY));if(data&&data.version===1&&Array.isArray(data.fleet)&&data.fleet.length===30&&Array.isArray(data.jobs)&&data.settings){state=data;return}}catch(e){}newState()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function logEvent(str){state.logs.unshift({day:state.day,message:str});state.logs=state.logs.slice(0,85)}
function tripDays(dist){return Math.max(2,Math.ceil((dist*2)/470)+1)}
function eligible(truck,job){return TYPES[truck.type].compat.includes(job.type)&&truck.cap>=job.tons}
function available(truck){return truck.availableDay<=state.day}
function costs(job,truck,value,commissionPct){let v=Number(value)||0;let distance=job.km*2;let t=TYPES[truck.type];let days=tripDays(job.km);let fuel=distance/truck.kmL*state.settings.diesel;let maintenance=distance*t.maint;let fixed=days*t.fixed;let commission=v*(commissionPct===undefined?truck.commission:commissionPct)/100;let tax=v*state.settings.tax/100;let operational=fuel+maintenance+fixed;let total=operational+commission+tax;let profit=v-total;let margin=v>0?profit/v*100:0;let minimum=(operational/(1-state.settings.tax/100-(commissionPct===undefined?truck.commission:commissionPct)/100-state.settings.target/100));return {distance,days,fuel,maintenance,fixed,operational,commission,tax,total,profit,margin,minimum,toll:Math.round(distance*.42)} }
function createJob(spec){state.seq++;return {id:`FR-${String(state.seq).padStart(4,'0')}`,created:state.day,status:'open',origin:'Sorocaba',destination:spec.destination,km:spec.km,type:spec.type,tons:spec.tons,amount:spec.amount,manual:!!spec.manual,acceptedTrip:null}}
function generateJobs(n){for(let i=0;i<n;i++){let type=pick(['seca','seca','sider','sider','granel']);let cargo=CARGOS[type];let [destination,baseDist]=pick(DEST);let km=Math.max(50,baseDist+randInt(-15,15));let tons=randInt(cargo.min,cargo.max);let model=state.fleet.find(t=>eligible(t,{type,tons}));let trial={km,type,tons};let exp=costs(trial,model,3000);let minCover=exp.operational/(1-state.settings.tax/100-model.commission/100);let amount=Math.round(minCover*(.87+random()*.60)/50)*50;state.jobs.push(createJob({destination,km,type,tons,amount}))}}
function todayJobs(){return state.jobs.filter(j=>j.created===state.day)}
function activeJobs(){return todayJobs().filter(j=>j.status==='open')}
function countAvailable(){return state.fleet.filter(available).length}
function sumData(){const sum=k=>state.trips.reduce((total,t)=>total+(t.finance[k]||0),0);return {revenue:sum('revenue'),fuel:sum('fuel'),maintenance:sum('maintenance'),fixed:sum('fixed'),commission:sum('commission'),tax:sum('tax'),profit:sum('profit'),trips:state.trips.length}}
function uiTab(label,icon,tab){return `<button class="tab ${ui.tab===tab?'active':''}" data-action="tab" data-tab="${tab}" role="tab" aria-selected="${ui.tab===tab}">${icon} ${label}</button>`}
function stats(){let fin=sumData();return `<div class="stats"><div class="stat"><div class="lbl"><span class="statusdot"></span> Caminhões disponíveis</div><div class="value">${countAvailable()} <span class="muted" style="font-size:14px">/ 30</span></div><div class="sub">${30-countAvailable()} em viagem</div></div><div class="stat"><div class="lbl"><span class="statusdot busy"></span> Fretes em aberto</div><div class="value">${activeJobs().length}</div><div class="sub">Propostas para o dia ${state.day}</div></div><div class="stat"><div class="lbl">◈ Viagens contratadas</div><div class="value">${fin.trips}</div><div class="sub">Desde o início da simulação</div></div><div class="stat"><div class="lbl">↗ Resultado estimado</div><div class="value" style="color:${fin.profit>=0?'#0b8c74':'#c14b40'};font-size:clamp(19px,2.4vw,26px)">${formatMoney(fin.profit)}</div><div class="sub">Resultado acumulado de fretes</div></div></div>`}
function render(){document.getElementById('app').innerHTML=`<header><div class="headerline"><div class="brand"><div class="logo">↗</div><div><strong>ROTA<span style="color:#72dcc3">LAB</span></strong><small>Laboratório de programação logística</small></div></div><div class="headright"><span class="note-badge">MODO TREINO · FICTÍCIO</span><span class="daybadge">☀ Dia ${state.day}</span></div></div><p class="headernote">Você coordena 30 caminhões e recebe ofertas de frete de um cliente industrial fictício, inspirado na operação que descreveu.</p></header><main class="wrap">${stats()}<nav class="tabbar" role="tablist" aria-label="Áreas do simulador">${uiTab('Fretes','▤','fretes')}${uiTab('Frota','▦','frota')}${uiTab('Financeiro','◉','financeiro')}${uiTab('Treinamento','◎','treino')}</nav><section id="currentView">${view()}</section><p class="footer">ROTA LAB · Simulação educativa, offline e sem dados reais. Não substitui cotação, tributação, normas de transporte ou regras da transportadora.</p></main>${ui.drawerId?drawer():''}`;document.body.classList.toggle('no-scroll',!!ui.drawerId)}
function view(){switch(ui.tab){case'frota':return viewFleet();case'financeiro':return viewFinance();case'treino':return viewTraining();default:return viewJobs()}}
function chip(label,action,value,current){return `<button class="chip ${current===value?'active':''}" data-action="${action}" data-value="${value}">${label}</button>`}
function viewJobs(){const offers=todayJobs();let shown=offers.filter(j=>ui.jobFilter==='todos'||(ui.jobFilter==='abertos'&&j.status==='open')||(ui.jobFilter==='aceitos'&&j.status==='accepted')||(ui.jobFilter==='recusados'&&j.status==='rejected'));let accepted=offers.filter(j=>j.status==='accepted').length;const ready=state.fleet.filter(available).length;return `<div class="section-head"><div><div class="eyebrow">Central de programação</div><h1>Fretes oferecidos</h1><p>Analise a carga, selecione um veículo e decida se a viagem é rentável.</p></div><div class="top-actions"><button class="btn ghost" data-action="new-job">+ Criar frete</button><button class="btn primary" data-action="next-day">Próximo dia →</button></div></div><div class="content-grid"><div><div class="chips">${chip(`Abertos (${offers.filter(j=>j.status==='open').length})`,'filter-jobs','abertos',ui.jobFilter)}${chip(`Aceitos (${accepted})`,'filter-jobs','aceitos',ui.jobFilter)}${chip('Recusados','filter-jobs','recusados',ui.jobFilter)}${chip('Todos','filter-jobs','todos',ui.jobFilter)}</div>${shown.length?`<div class="jobgrid">${shown.map(jobCard).join('')}</div>`:`<div class="empty"><strong>Nenhum frete nesta categoria.</strong><p>Se não houver propostas abertas, avance para o próximo dia ou crie uma oferta manual.</p></div>`}</div><aside class="side-stack"><div class="panel"><div class="eyebrow">Sua missão</div><h3>Seja um bom programador</h3><p>Escolha fretes com margem prevista de pelo menos <strong>${state.settings.target}%</strong>. Não aceite todo pedido só para manter o caminhão rodando.</p><div class="settingsrow"><span class="small-text muted">Fretes acima da meta</span><strong>${state.trips.filter(t=>t.finance.margin>=state.settings.target).length} / ${Math.max(3,state.trips.length)}</strong></div><div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,100*state.trips.filter(t=>t.finance.margin>=state.settings.target).length/3)}%"></div></div><p class="small-text" style="margin:5px 0 0">Desafio inicial: aprovar 3 fretes saudáveis.</p></div><div class="panel"><div class="eyebrow">Como jogar</div><ol class="how-list"><li><span class="num">1</span><span>Abra uma oferta de frete e confira distância, carga e valor.</span></li><li><span class="num">2</span><span>Escolha um dos <strong>${ready} veículos livres</strong> compatíveis.</span></li><li><span class="num">3</span><span>Compare diesel, manutenção, comissões, tributos e margem.</span></li><li><span class="num">4</span><span>Despache ou recuse. Avance o dia para liberar os veículos que retornaram.</span></li></ol></div><div class="asidewarning"><strong>Regras simplificadas:</strong> os caminhões saem de Sorocaba, fazem ida e volta sem carga de retorno e ficam indisponíveis por alguns dias. Quilometragens, valores e custos são fictícios; pedágio é tratado à parte.</div></aside></div>`}
function jobCard(j){let eligibleCount=state.fleet.filter(t=>available(t)&&eligible(t,j)).length;let status=j.status==='open'?['green','Disponível']:j.status==='accepted'?['grey','Despachado']:['red','Recusado'];return `<article class="job"><div class="jobtop"><span class="serial">${escape(j.id)} · OFERTA DO DIA ${j.created}</span><span class="pill ${status[0]}">${status[1]}</span></div><div class="route">${escape(j.origin)} <span class="route-arrow">→</span> ${escape(j.destination)}<small>Cliente industrial simulado · ${escape(CARGOS[j.type].nome)}</small></div><div class="facts"><span class="fact">⚖ ${j.tons} toneladas</span><span class="fact">↔ ${j.km*2} km total</span><span class="fact">▱ ${tripDays(j.km)} dias</span></div><div class="jobbottom"><div class="price"><span>Frete proposto (sem pedágio)</span><strong>${formatMoney(j.amount)}</strong><span>${j.status==='open'?`${eligibleCount} caminhão(ões) compatíveis e livres`:j.status==='accepted'?'Viagem programada':'Oferta descartada'}</span></div>${j.status==='open'?`<button class="btn primary small" data-action="analyze" data-id="${escape(j.id)}">Analisar →</button>`:`<span class="status-msg">${j.status==='accepted'?'✓ Registrado':'– Recusado'}</span>`}</div></article>`}
function viewFleet(){let arr=state.fleet.filter(t=>(ui.fleetFilter==='todos'||(ui.fleetFilter==='livres'&&available(t))||(ui.fleetFilter==='ocupados'&&!available(t)))&&(ui.fleetType==='todos'||ui.fleetType===t.type));return `<div class="section-head"><div><div class="eyebrow">Gestão da disponibilidade</div><h1>Seus 30 caminhões</h1><p>Cada veículo tem capacidade, consumo, carroceria e motorista comissionado.</p></div><div class="top-actions"><button class="btn ghost" data-action="tab" data-tab="fretes">Ver ofertas →</button></div></div><div class="chips">${chip('Todos (30)','fleet-filter','todos',ui.fleetFilter)}${chip(`Livres (${countAvailable()})`,'fleet-filter','livres',ui.fleetFilter)}${chip(`Em viagem (${30-countAvailable()})`,'fleet-filter','ocupados',ui.fleetFilter)}</div><div class="chips">${chip('Todas as carrocerias','fleet-type','todos',ui.fleetType)}${chip('Trucks','fleet-type','seca',ui.fleetType)}${chip('Siders','fleet-type','sider',ui.fleetType)}${chip('Graneleiras','fleet-type','granel',ui.fleetType)}</div>${arr.length?`<div class="fleetgrid">${arr.map(t=>`<div class="truckcard"><div class="ttop"><span class="id">${t.id}</span><span class="pill ${available(t)?'green':'amber'}">${available(t)?'Livre':`Até dia ${t.availableDay}`}</span></div><div class="model">${TYPES[t.type].label}</div><div class="sub">${escape(t.driver)} · ${t.commission}% comissão</div><div class="summary-strip"><span>${t.cap} t</span><span>${formatNum(t.kmL)} km/l</span></div><div class="meta">${available(t)?'Pronto para nova alocação':`Em viagem: ${escape(t.assignment||'Frete')}`}<br>Viagens contratadas: <strong>${t.completed}</strong></div></div>`).join('')}</div>`:`<div class="empty"><strong>Não há veículos com esses filtros.</strong></div>`}`}
function viewFinance(){let fin=sumData();let good=state.trips.filter(t=>t.finance.margin>=state.settings.target).length;let losses=state.trips.filter(t=>t.finance.profit<0).length;return `<div class="section-head"><div><div class="eyebrow">Visão do dono da transportadora</div><h1>Financeiro dos fretes</h1><p>Apuração simplificada das viagens contratadas, com resultado projetado no momento do despacho.</p></div><button class="btn ghost" data-action="tab" data-tab="fretes">Programar fretes →</button></div><div class="panel"><div class="financials"><div class="finbox"><small>Receita de frete</small><strong>${formatMoney(fin.revenue)}</strong></div><div class="finbox"><small>Custos estimados totais</small><strong>${formatMoney(fin.revenue-fin.profit)}</strong></div><div class="finbox"><small>Comissões dos motoristas</small><strong>${formatMoney(fin.commission)}</strong></div><div class="finbox"><small>Resultado operacional estimado</small><strong class="${fin.profit>=0?'positive':'negative'}">${formatMoney(fin.profit)}</strong></div></div><div class="grid2"><div><div class="costline"><span>Diesel</span><strong>${formatMoney(fin.fuel)}</strong></div><div class="costline"><span>Manutenção e pneus (provisão)</span><strong>${formatMoney(fin.maintenance)}</strong></div><div class="costline"><span>Custos fixos alocados</span><strong>${formatMoney(fin.fixed)}</strong></div><div class="costline"><span>Tributos didáticos</span><strong>${formatMoney(fin.tax)}</strong></div></div><div class="callout"><strong>Indicadores de decisão</strong><p style="margin:9px 0 0">✅ ${good} frete(s) acima da meta de ${state.settings.target}%<br>⚠️ ${losses} frete(s) com prejuízo previsto<br>📈 Margem geral: <strong>${fin.revenue>0?formatNum(fin.profit/fin.revenue*100):'0'}%</strong></p></div></div></div><h2 style="margin:24px 0 11px">Viagens contratadas</h2>${state.trips.length?`<div class="ledger">${state.trips.slice().reverse().map(t=>`<article class="trip"><div><strong>${escape(t.jobId)} · ${escape(t.origin)} → ${escape(t.destination)}</strong><small>Dia ${t.day} · ${escape(t.truckId)} · ${escape(t.driver)} · Retorno dia ${t.returnDay}</small><div class="summary-strip" style="margin-top:9px"><span>Frete ${formatMoney(t.finance.revenue)}</span><span>Comissão ${formatMoney(t.finance.commission)}</span><span>Margem ${formatNum(t.finance.margin)}%</span></div></div><div style="text-align:right"><span class="result ${t.finance.profit>=0?'positive':'negative'}">${formatMoney(t.finance.profit)}</span><small style="display:block">resultado previsto</small></div></article>`).join('')}</div>`:`<div class="empty"><strong>Você ainda não programou nenhum frete.</strong><p>Volte para Fretes, abra uma proposta, escolha o veículo e confirme o despacho.</p></div>`}<div class="settingnote">Resultados projetados, não liquidação financeira: a simulação não inclui todos os custos reais, particularidades tributárias, regras comerciais nem remuneração líquida pessoal do motorista.</div>`}
function viewTraining(){return `<div class="section-head"><div><div class="eyebrow">Aprendizado prático</div><h1>Treinamento e configurações</h1><p>Ajuste as premissas e crie uma oferta para testar decisões diferentes.</p></div></div><div class="grid2"><div class="panel"><div class="eyebrow">Variáveis econômicas</div><h2>Custos da operação</h2><p>Estas configurações afetam as <strong>próximas análises</strong>. Viagens já registradas preservam seus cálculos históricos.</p><form id="settings-form"><div class="form-grid"><div class="field"><label for="diesel">Diesel (R$/litro)</label><input id="diesel" name="diesel" type="number" min="0.1" step="0.01" required value="${state.settings.diesel}"></div><div class="field"><label for="tax">Tributos didáticos (%)</label><input id="tax" name="tax" type="number" min="0" max="40" step="0.5" required value="${state.settings.tax}"></div><div class="field"><label for="target">Margem mínima desejada (%)</label><input id="target" name="target" type="number" min="0" max="50" step="1" required value="${state.settings.target}"></div></div><button type="submit" class="btn primary">Salvar parâmetros</button></form><div class="divider"></div><h3>Que custos entram na conta?</h3><p><strong>Combustível:</strong> quilômetros totais ÷ consumo do veículo × preço do diesel.<br><strong>Manutenção:</strong> quilômetros totais × custo por km da categoria.<br><strong>Custos fixos:</strong> dias estimados de imobilização × valor por tipo de caminhão.<br><strong>Comissão:</strong> porcentagem do valor do frete, ajustável em cada análise.<br><strong>Tributos:</strong> percentual simplificado, apenas para fins didáticos.</p><div class="subtle-warning">Pedágio estimado aparece à parte como lembrete de programação; este jogo presume cobertura separada. Não usa tabela oficial de piso mínimo, regras tributárias reais ou jornada legal de direção.</div></div><div class="panel"><div class="eyebrow">Missão extra</div><h2>Crie seu próprio frete</h2><p>Pratique um caso da entrevista: defina destino, carga, distância e valor oferecido.</p><form id="newjob-form"><div class="field"><label for="jdest">Destino</label><input id="jdest" name="destination" type="text" maxlength="48" placeholder="Ex.: Campinas" required></div><div class="form-grid"><div class="field"><label for="jtype">Tipo de carga</label><select id="jtype" name="type"><option value="seca">Material ensacado</option><option value="sider">Paletizada (sider)</option><option value="granel">Cimento a granel</option></select></div><div class="field"><label for="jtons">Peso (toneladas)</label><input id="jtons" name="tons" type="number" min="1" max="30" step="0.5" value="12" required></div><div class="field"><label for="jkm">Quilômetros (só ida)</label><input id="jkm" name="km" type="number" min="10" max="2500" step="1" value="180" required></div><div class="field"><label for="jval">Valor oferecido (R$)</label><input id="jval" name="amount" type="number" min="1" max="1000000" step="1" value="3500" required></div></div><button class="btn dark full" type="submit">Criar e analisar frete →</button></form></div></div><div class="grid2" style="margin-top:14px"><div class="panel"><div class="eyebrow">Exemplo para aprender</div><h2>Por que a carroceria importa?</h2><p>Uma carreta graneleira não é intercambiável com um caminhão para carga seca. A compatibilidade da carga, a capacidade de peso e a disponibilidade do motorista são avaliadas antes do preço.</p><p>Depois vem a conta: frete oferecido, ida e retorno, consumo, manutenção, custos fixos, comissões e margem. O veículo mais barato nem sempre estará livre.</p></div><div class="panel"><div class="eyebrow">Para sua entrevista</div><h2>Questões que você poderá explicar</h2><p>Como escolher um caminhão para determinada carga? O que fazer quando os veículos compatíveis estão todos em viagem? Como avaliar se um frete com retorno vazio compensa? Quanto o motorista recebe? Quando vale negociar ou recusar um pedido?</p><details><summary>Ver os limites da simulação</summary><p>Não há localização ao vivo, sistema de rastreamento, frotas de terceiros, restrições de eixo, legislação, peso por eixo, carregamento parcial, múltiplas entregas, frete de retorno, negociação real ou previsão de caixa. A simulação é propositalmente básica para treinar o raciocínio.</p></details><div class="divider"></div><button class="btn danger small" data-action="reset">↺ Recomeçar simulação</button><p class="footnote">Os dados são guardados apenas neste navegador, quando o armazenamento local está disponível.</p></div></div>`}
function openJob(id){let job=state.jobs.find(j=>j.id===id);if(!job||job.status!=='open')return;let matches=state.fleet.filter(t=>available(t)&&eligible(t,job));let cheapest=matches.slice().sort((a,b)=>costs(job,b,job.amount).profit-costs(job,a,job.amount).profit)[0];ui.drawerId=id;ui.draft={truckId:cheapest?.id||null,amount:job.amount,commission:cheapest?.commission||12};render()}
function drawer(){if(ui.drawerId==='new')return newJobDrawer();let job=state.jobs.find(j=>j.id===ui.drawerId);if(!job)return '';let compatibles=state.fleet.filter(t=>available(t)&&eligible(t,job));let selected=state.fleet.find(t=>t.id===ui.draft?.truckId);let c=selected?costs(job,selected,ui.draft.amount,ui.draft.commission):null;return `<div class="drawer-back" data-action="backdrop"><section class="drawer" role="dialog" aria-modal="true" aria-label="Analisar oferta de frete"><div class="drawer-head"><div><div class="eyebrow">${escape(job.id)} · Análise de despacho</div><h2 style="margin:2px 0 0">${escape(job.origin)} → ${escape(job.destination)}</h2></div><button class="iconbutton" data-action="close" aria-label="Fechar">×</button></div><div class="drawer-body"><div class="summary-strip"><span>${CARGOS[job.type].nome}</span><span>${job.tons} t</span><span>${job.km*2} km (ida e volta)</span><span>${tripDays(job.km)} dias de ciclo</span></div><p class="footnote">O retorno está considerado vazio. Distância e duração são fictícias.</p><div class="divider"></div><h3>1. Escolha o veículo</h3><div class="field"><label for="drawer-truck">Caminhões compatíveis e disponíveis (${compatibles.length})</label><select id="drawer-truck" data-input="truck" ${compatibles.length?'':'disabled'}>${compatibles.map(t=>`<option value="${t.id}" ${selected?.id===t.id?'selected':''}>${t.id} · ${TYPES[t.type].short} · ${t.cap} t · ${formatNum(t.kmL)} km/l</option>`).join('')}${compatibles.length?'':'<option>Nenhum caminhão disponível</option>'}</select></div>${selected?`<div class="settingnote" style="margin:7px 0 14px">${selected.driver} · comissão habitual ${selected.commission}% · capacidade ${selected.cap} t · consumo ${formatNum(selected.kmL)} km/l.</div>`:`<div class="highlight warn"><strong>Sem caminhão compatível livre</strong><small>Verifique os veículos ocupados, escolha outra carga ou avance o dia para esperar retornos.</small></div>`}<h3>2. Avalie a proposta</h3><div class="form-grid"><div class="field"><label for="drawer-amount">Valor do frete (R$)</label><input id="drawer-amount" type="number" step="50" min="1" max="1000000" data-input="amount" value="${ui.draft.amount}"></div><div class="field"><label for="drawer-commission">Comissão motorista (%)</label><input id="drawer-commission" type="number" step="0.5" min="0" max="50" data-input="commission" value="${ui.draft.commission}"></div></div><p class="footnote" style="margin-top:-7px">Pode alterar o preço para simular uma negociação e a comissão do motorista para esta viagem.</p>${c?`<div class="breakdown"><h4>Previsão de custos da viagem</h4>${line('Receita do frete',formatMoney(ui.draft.amount))}${line('Diesel (ida + volta)',`− ${formatMoney(c.fuel)}`)}${line('Manutenção e pneus',`− ${formatMoney(c.maintenance)}`)}${line('Custos fixos alocados',`− ${formatMoney(c.fixed)}`)}${line(`Comissão (${ui.draft.commission}%)`,`− ${formatMoney(c.commission)}`)}${line(`Tributos didáticos (${state.settings.tax}%)`,`− ${formatMoney(c.tax)}`)}<div class="divider" style="margin:8px 0"></div><div class="settingsrow"><strong>Resultado projetado da empresa</strong><strong class="${c.profit>=0?'positive':'negative'}">${formatMoney(c.profit)}</strong></div><div class="twocol" style="margin-top:12px"><div class="mini-kpi"><small>Margem do frete</small><strong class="${c.margin>=state.settings.target?'positive':c.profit<0?'negative':'neutral'}">${formatNum(c.margin)}%</strong></div><div class="mini-kpi"><small>Comissão bruta do motorista</small><strong>${formatMoney(c.commission)}</strong></div></div></div><div class="highlight ${c.profit<0?'bad':c.margin<state.settings.target?'warn':''}"><strong>${c.profit<0?'⛔ Prejuízo projetado':c.margin<state.settings.target?'⚠️ Margem abaixo da meta':'✓ Margem dentro da meta'}</strong><small>${c.profit<0?'A proposta não cobre os custos estimados. Considere negociar ou recusar.':c.margin<state.settings.target?`A margem prevista é ${formatNum(c.margin)}%, abaixo de ${state.settings.target}%. Estude uma negociação.`:`A margem prevista atingiu a meta de ${state.settings.target}%. Confira também viabilidade operacional e prazos.`}</small></div><div class="costline"><span>Frete mínimo estimado para ${state.settings.target}% de margem</span><strong>${Number.isFinite(c.minimum)?formatMoney(Math.ceil(c.minimum/50)*50):'Indefinido'}</strong></div><div class="costline"><span>Pedágio referencial, separado do frete</span><strong>~ ${formatMoney(c.toll)}</strong></div><p class="footnote">Pedágio mostrado apenas como referência fictícia de planejamento, fora do cálculo de resultado; o jogo presume provisão/reembolso separado. Comissão bruta ≠ lucro pessoal do motorista.</p><div style="display:grid;gap:9px;margin-top:18px"><button class="btn primary full" data-action="dispatch">Confirmar despacho →</button><button class="btn danger full" data-action="reject">Recusar este frete</button></div>`:`<div style="margin-top:16px"><button class="btn danger full" data-action="reject">Recusar este frete</button></div>`}</div></section></div>`}
function line(a,b){return `<div class="costline"><span>${a}</span><strong>${b}</strong></div>`}
function newJobDrawer(){return `<div class="drawer-back" data-action="backdrop"><section class="drawer" role="dialog" aria-modal="true" aria-label="Criar frete"><div class="drawer-head"><div><div class="eyebrow">Criar caso de teste</div><h2>Uma nova oferta</h2></div><button class="iconbutton" data-action="close" aria-label="Fechar">×</button></div><div class="drawer-body"><p>Crie um frete hipotético e teste quais caminhões poderiam executá-lo.</p><form id="quickjob-form"><div class="field"><label for="qdest">Destino</label><input id="qdest" name="destination" placeholder="Ex.: Campinas" required maxlength="48"></div><div class="field"><label for="qtype">Tipo de carga</label><select name="type" id="qtype"><option value="seca">Material ensacado</option><option value="sider">Paletizada · sider</option><option value="granel">Cimento a granel</option></select></div><div class="form-grid"><div class="field"><label for="qtons">Peso (t)</label><input id="qtons" name="tons" type="number" min="1" max="30" step="0.5" value="12" required></div><div class="field"><label for="qkm">Distância só ida (km)</label><input id="qkm" name="km" type="number" min="10" max="2500" step="1" value="180" required></div></div><div class="field"><label for="qamount">Frete proposto (R$)</label><input id="qamount" name="amount" type="number" min="1" max="1000000" step="1" value="3500" required></div><button type="submit" class="btn primary full">Criar proposta e analisar →</button></form></div></section></div>`}
function notify(message){document.querySelector('.toast')?.remove();let div=document.createElement('div');div.className='toast';div.setAttribute('role','status');div.textContent=message;document.body.appendChild(div);clearTimeout(toastTimer);toastTimer=setTimeout(()=>div.remove(),3900)}
function closeDrawer(){ui.drawerId=null;ui.draft=null;render()}
function doDispatch(){let job=state.jobs.find(j=>j.id===ui.drawerId);let t=state.fleet.find(t=>t.id===ui.draft?.truckId);if(!job||job.status!=='open'||!t||!available(t)||!eligible(t,job)){notify('Veículo indisponível ou não compatível.');return}let price=Number(ui.draft.amount),pct=Number(ui.draft.commission);if(!Number.isFinite(price)||price<=0||!Number.isFinite(pct)||pct<0||pct>50){notify('Confira o valor do frete e a comissão.');return}let c=costs(job,t,price,pct);if(c.profit<0&&!confirm(`Este frete tem PREJUÍZO estimado de ${formatMoney(Math.abs(c.profit))}. Deseja despachar mesmo assim para fins de treinamento?`))return;if(c.profit>=0&&c.margin<state.settings.target&&!confirm(`Margem ${formatNum(c.margin)}%, abaixo da sua meta de ${state.settings.target}%. Confirmar mesmo assim?`))return;let returnDay=state.day+c.days;t.availableDay=returnDay;t.assignment=job.id;t.completed++;job.status='accepted';job.acceptedTrip=state.trips.length+1;state.trips.push({jobId:job.id,origin:job.origin,destination:job.destination,truckId:t.id,driver:t.driver,day:state.day,returnDay,finance:{...c,revenue:price},commissionPct:pct,tons:job.tons});logEvent(`${job.id} aceito: ${t.id}, margem ${formatNum(c.margin)}%`);save();ui.drawerId=null;ui.draft=null;render();notify(c.profit<0?'Viagem programada com alerta de prejuízo.':c.margin<state.settings.target?'Viagem programada. Atenção à margem baixa.':'Boa escolha! Veículo programado e custos registrados.')}
function reject(){let job=state.jobs.find(j=>j.id===ui.drawerId);if(!job)return;job.status='rejected';logEvent(`${job.id} recusado`);save();ui.drawerId=null;ui.draft=null;render();notify('Frete recusado. Decisão registrada.')}
function advance(){let open=activeJobs();let oldDay=state.day;let busyBefore=30-countAvailable();for(const job of open)job.status='expired';state.day++;let returns=state.fleet.filter(t=>t.availableDay===state.day);for(const t of returns)t.assignment=null;generateJobs(randInt(9,12));logEvent(`Dia ${oldDay} encerrado: ${open.length} ofertas expiradas, ${returns.length} caminhões retornaram`);save();ui.tab='fretes';ui.jobFilter='abertos';ui.drawerId=null;render();notify(`Dia ${state.day}: ${returns.length} retorno(s), ${activeJobs().length} novos fretes. ${busyBefore} caminhão(ões) estavam em viagem.`)}
function submitJob(form){let data=new FormData(form);let destination=String(data.get('destination')||'').trim();let type=String(data.get('type')||'');let tons=Number(data.get('tons')),km=Number(data.get('km')),amount=Number(data.get('amount'));if(!destination||destination.length>48||!CARGOS[type]||!Number.isFinite(tons)||tons<1||tons>30||!Number.isFinite(km)||km<10||km>2500||!Number.isFinite(amount)||amount<=0||amount>1000000){notify('Confira os dados da nova oferta.');return}let job=createJob({destination,type,tons,km,amount,manual:true});state.jobs.push(job);save();ui.tab='fretes';ui.jobFilter='abertos';openJob(job.id);notify('Frete fictício criado. Agora escolha um caminhão.')}
function onClick(e){let b=e.target.closest('[data-action]');if(!b)return;let action=b.dataset.action;if(action==='backdrop'&&e.target!==b)return;switch(action){case'tab':ui.tab=b.dataset.tab;ui.drawerId=null;render();break;case'filter-jobs':ui.jobFilter=b.dataset.value;render();break;case'fleet-filter':ui.fleetFilter=b.dataset.value;render();break;case'fleet-type':ui.fleetType=b.dataset.value;render();break;case'analyze':openJob(b.dataset.id);break;case'close':case'backdrop':closeDrawer();break;case'new-job':ui.drawerId='new';ui.draft=null;render();break;case'dispatch':doDispatch();break;case'reject':reject();break;case'next-day':if(activeJobs().length&&!confirm(`Encerrar dia ${state.day}? As ${activeJobs().length} ofertas em aberto vão expirar. Caminhões em viagem só ficam livres no dia do retorno.`))return;advance();break;case'reset':if(!confirm('Recomeçar? Toda a simulação atual neste navegador será apagada.'))return;newState();save();ui={tab:'fretes',jobFilter:'abertos',fleetFilter:'todos',fleetType:'todos',drawerId:null,draft:null};render();notify('Simulação reiniciada com 30 caminhões.');break;}}
function onChange(e){let k=e.target.dataset.input;if(!k||!ui.draft)return;if(k==='truck'){ui.draft.truckId=e.target.value;let truck=state.fleet.find(t=>t.id===e.target.value);if(truck)ui.draft.commission=truck.commission}else if(k==='amount'){ui.draft.amount=Math.max(1,Number(e.target.value)||1)}else if(k==='commission'){ui.draft.commission=Math.max(0,Math.min(50,Number(e.target.value)||0))}render()}
function onSubmit(e){if(!['quickjob-form','newjob-form','settings-form'].includes(e.target.id))return;e.preventDefault();if(e.target.id==='settings-form'){let f=new FormData(e.target);let diesel=Number(f.get('diesel')),tax=Number(f.get('tax')),target=Number(f.get('target'));if(!(diesel>.1&&diesel<100&&tax>=0&&tax<=40&&target>=0&&target<=50&&tax+target+15<99)){notify('Confira os parâmetros da simulação.');return}state.settings={diesel,tax,target};save();render();notify('Novos parâmetros aplicados às próximas análises.')}else submitJob(e.target)}
function init(){load();document.addEventListener('click',onClick);document.addEventListener('change',onChange);document.addEventListener('submit',onSubmit);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.drawerId)closeDrawer()});render()}
init();
})();
</script>
